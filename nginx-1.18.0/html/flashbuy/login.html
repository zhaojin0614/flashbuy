<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 闪购 FlashBuy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav" class="nav"></div>
  <div class="login-wrap">
    <div class="card login-card">
      <h1>闪购 FlashBuy</h1>
      <p class="tip sub">限量好物 · 手慢无</p>
      <div class="field">
        <label>手机号</label>
        <input id="phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号">
      </div>
      <div class="field">
        <label>验证码</label>
        <input id="code" type="text" maxlength="6" placeholder="请输入验证码">
      </div>
      <button class="btn" id="sendBtn" onclick="sendCode()">获取验证码</button>
      <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
      <div class="login-hint">
        演示环境说明：点击「获取验证码」后，验证码会输出到后端应用控制台日志，请在日志中查看后输入。
      </div>
    </div>
  </div>
  <script src="/js/axios.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    renderNav('');
    let countdown = 0;
    async function sendCode() {
      const phone = document.getElementById('phone').value.trim();
      if (!/^1\d{10}$/.test(phone)) return toast('请输入正确的手机号', 'error');
      try {
        await axios.post('/user/code?phone=' + phone);
        toast('验证码已发送，请查看后端控制台日志', 'success');
        countdown = 60;
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        const timer = setInterval(() => {
          btn.textContent = countdown-- + 's 后重发';
          if (countdown < 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
        }, 1000);
      } catch (e) { toast(e, 'error'); }
    }
    async function doLogin() {
      const phone = document.getElementById('phone').value.trim();
      const code = document.getElementById('code').value.trim();
      if (!/^1\d{10}$/.test(phone)) return toast('请输入正确的手机号', 'error');
      if (!code) return toast('请输入验证码', 'error');
      try {
        const r = await axios.post('/user/login', { phone, code });
        sessionStorage.setItem('token', r.data.token);
        try {
          const me = await axios.get('/user/me');
          sessionStorage.setItem('nick', me.data.nick || '我');
          sessionStorage.setItem('avatar', me.data.icon || '/imgs/icons/user.png');
        } catch (e) { /* 忽略 */ }
        toast('登录成功', 'success');
        setTimeout(() => location.href = '/index.html', 600);
      } catch (e) { toast(e, 'error'); }
    }
  </script>
</body>
</html>
