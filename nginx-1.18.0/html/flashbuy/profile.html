<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 - 闪购 FlashBuy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav" class="nav"></div>
  <div class="container">
    <div class="profile-head">
      <img id="avatar" src="/imgs/icons/user.png" alt="">
      <div>
        <h1 id="nick">加载中…</h1>
        <div style="opacity:.85;font-size:13px;margin-top:4px" id="phone"></div>
      </div>
    </div>
    <div class="card sign-card">
      <div class="sign-num"><b id="streakNum">-</b><span>连续签到（天）</span></div>
      <div class="sign-num"><b id="todayState">-</b><span>今日状态</span></div>
      <button class="btn" id="signBtn" onclick="doSign()">📅 签到打卡</button>
      <div class="link-out" onclick="doLogout()">退出登录</div>
    </div>
    <div class="card" style="margin-top:18px;padding:22px">
      <div class="section-title" style="margin:0 0 10px">我的订单</div>
      <div id="orderList"><div class="sub">加载中…</div></div>
    </div>
  </div>
  <script src="/js/axios.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    renderNav('');
    if (!isLoggedIn()) goLogin();
    async function loadProfile() {
      // 并行拉取用户信息与签到状态，避免串行等待
      const [meR, cntR] = await Promise.allSettled([
        axios.get('/user/me'),
        axios.get('/user/sign/count')
      ]);
      if (meR.status === 'fulfilled') {
        const me = meR.value.data;
        document.getElementById('nick').textContent = me.nickName || me.nick || '闪友';
        document.getElementById('avatar').src = me.icon || '/imgs/icons/user.png';
      }
      // /user/sign/count 返回连续签到天数；语义上 count>0 ⟺ 今天已签到
      updateSignState(cntR.status === 'fulfilled' ? (cntR.value.data || 0) : null);
    }
    async function loadOrders() {
      try {
        const r = await axios.get('/order/of/me');
        const box = document.getElementById('orderList');
        if (!r.data.length) {
          box.innerHTML = '<div class="sub">暂无订单——去 <a href="/index.html" style="color:var(--primary)">首页</a> 抢一单限量好物吧</div>';
          return;
        }
        box.innerHTML = r.data.map(o => `
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f1eef9">
            <div style="flex:1">
              <div style="font-size:14px;font-weight:600">${o.title || '商品 #' + o.productId}</div>
              <div class="sub">${o.merchantName || ''} · ${(o.createTime || '').replace('T', ' ').slice(0, 16)}</div>
            </div>
            <div style="text-align:right">
              <div class="price" style="font-size:16px">¥${((o.payValue || 0) / 100).toFixed(2)}</div>
              <div class="sub">订单 ${o.orderId}</div>
            </div>
          </div>`).join('');
      } catch (e) {
        document.getElementById('orderList').innerHTML = `<div class="sub">${e}</div>`;
      }
    }
    function updateSignState(count) {
      document.getElementById('streakNum').textContent = count === null ? '-' : count;
      const signed = count !== null && count > 0;
      document.getElementById('todayState').textContent = count === null ? '-' : (signed ? '已签' : '未签');
      document.getElementById('signBtn').disabled = signed;
      document.getElementById('signBtn').textContent = signed ? '✓ 今日已签到' : '📅 签到打卡';
    }
    async function doSign() {
      const btn = document.getElementById('signBtn');
      try {
        await axios.post('/user/sign');
        toast('签到成功 🎉', 'success');
      } catch (e) {
        toast(typeof e === 'string' ? e : '签到失败', 'error');
      }
      // 无论成功与否都按后端真实状态刷新
      try {
        const c = await axios.get('/user/sign/count');
        updateSignState(c.data || 0);
      } catch (e) { /* 下次刷新页面会再取 */ }
    }
    async function doLogout() {
      try { await axios.post('/user/logout'); } catch (e) { /* 忽略 */ }
      sessionStorage.clear();
      toast('已退出登录', 'success');
      setTimeout(() => location.href = '/index.html', 500);
    }
    loadProfile();
    loadOrders();
  </script>
</body>
</html>
