<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 - 闪购 FlashBuy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav" class="nav"></div>
  <div class="container">
    <div class="profile-head">
      <img id="avatar" src="/imgs/icons/user.png" alt="">
      <div class="profile-main">
        <h1 id="nick">加载中…</h1>
        <div class="sub" id="intro" style="opacity:.85;font-size:13px;margin-top:4px"></div>
        <div class="user-stats" style="color:rgba(255,255,255,.92)">
          <span onclick="goFollowList('fans')">粉丝 <b id="fansNum">0</b></span>
          <span onclick="goFollowList('followees')">关注 <b id="followeeNum">0</b></span>
        </div>
      </div>
      <button class="btn btn-ghost" style="margin-left:auto" onclick="location.href='/profile-edit.html'">编辑资料</button>
    </div>
    <div class="card sign-card">
      <div class="sign-num"><b id="monthNum">-</b><span>本月累计</span></div>
      <div class="sign-num"><b id="streakNum">-</b><span>连续签到</span></div>
      <div class="sign-num"><b id="todayState">-</b><span>今日状态</span></div>
      <button class="btn" id="signBtn" onclick="doSign()">📅 签到打卡</button>
      <div class="link-out" onclick="doLogout()">退出登录</div>
    </div>
    <div class="card" style="margin-top:18px;padding:22px">
      <div class="section-title" style="margin:0 0 10px">我的订单</div>
      <div id="orderList"><div class="sub">加载中…</div></div>
    </div>
    <div class="card" style="margin-top:18px;padding:22px">
      <div class="section-title" style="margin:0 0 10px;display:flex;justify-content:space-between;align-items:center">
        <span>我的晒单</span>
        <a href="/post-edit.html" style="font-size:13px;color:var(--primary)">+ 发布晒单</a>
      </div>
      <div id="myPostList"><div class="sub">加载中…</div></div>
    </div>

    <div class="card" style="margin-top:18px;padding:22px">
      <div class="section-title" style="margin:0 0 10px">关注动态</div>
      <div id="followFeed"><div class="sub">加载中…</div></div>
      <div style="text-align:center;margin-top:8px">
        <button class="btn btn-ghost" id="feedMore" onclick="loadFollowFeed(false)" style="display:none">加载更多</button>
      </div>
    </div>
  </div>
  <script src="/js/axios.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    renderNav('');
    if (!isLoggedIn()) goLogin();

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function goFollowList(type) {
      const uid = sessionStorage.getItem('uid');
      if (!uid) return toast('请先登录', 'error');
      location.href = '/follow-list.html?id=' + uid + '&type=' + type;
    }

    async function loadProfile() {
      const [meR, cntR, monR] = await Promise.allSettled([
        axios.get('/user/me'),
        axios.get('/user/sign/count'),
        axios.get('/user/sign/month-count')
      ]);
      if (meR.status === 'fulfilled') {
        const me = meR.value.data;
        document.getElementById('nick').textContent = me.nickName || me.nick || '闪友';
        document.getElementById('avatar').src = me.icon || '/imgs/icons/user.png';
        sessionStorage.setItem('uid', me.id);

        const [infoR, countR] = await Promise.allSettled([
          axios.get('/user/info/' + me.id),
          axios.get('/follow/count/' + me.id)
        ]);
        const info = infoR.status === 'fulfilled' ? infoR.value.data : null;
        const intro = info && info.introduce ? info.introduce : '还没有个人简介，点击右侧“编辑资料”补充';
        const city = info && info.city ? ' · ' + info.city : '';
        document.getElementById('intro').textContent = intro + city;
        if (countR.status === 'fulfilled' && countR.value.data) {
          document.getElementById('fansNum').textContent = countR.value.data.fans || 0;
          document.getElementById('followeeNum').textContent = countR.value.data.followee || 0;
        }
      }
      document.getElementById('monthNum').textContent =
        monR.status === 'fulfilled' ? (monR.value.data || 0) : '-';
      updateSignState(cntR.status === 'fulfilled' ? (cntR.value.data || 0) : null);
    }
    async function loadOrders() {
      try {
        const r = await axios.get('/order/of/me');
        const box = document.getElementById('orderList');
        if (!r.data.length) {
          box.innerHTML = '<div class="sub">暂无订单——去 <a href="/index.html" style="color:var(--primary)">首页</a> 抢一单限量好物吧</div>';
          return;
        }
        box.innerHTML = r.data.map(o => `
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f1eef9">
            <div style="flex:1">
              <div style="font-size:14px;font-weight:600">${o.title || '商品 #' + o.productId}</div>
              <div class="sub">${o.merchantName || ''} · ${(o.createTime || '').replace('T', ' ').slice(0, 16)}</div>
            </div>
            <div style="text-align:right">
              <div class="price" style="font-size:16px">¥${((o.payValue || 0) / 100).toFixed(2)}</div>
              <div class="sub">订单 ${o.orderId}</div>
            </div>
          </div>`).join('');
      } catch (e) {
        document.getElementById('orderList').innerHTML = `<div class="sub">${e}</div>`;
      }
    }
    async function loadMyPosts() {
      try {
        const r = await axios.get('/post/of/me');
        const box = document.getElementById('myPostList');
        if (!r.data.length) {
          box.innerHTML = '<div class="sub">还没有发布晒单，去记录一次抢购体验吧</div>';
          return;
        }
        box.innerHTML = r.data.map(p => {
          const imgs = (p.images || '').split(',').filter(Boolean);
          return `
            <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f1eef9;cursor:pointer"
                 onclick="location.href='/post-detail.html?id=${p.id}'">
              ${imgs.length ? `<img src="${imgs[0]}" style="width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0"
                    onerror="this.style.display='none'">` : ''}
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:600">${escapeHtml(p.title || '')}</div>
                <div class="sub">${escapeHtml(p.merchantName || '未关联商户')} · ${(p.createTime || '').replace('T', ' ').slice(0, 16)}</div>
                <div class="sub">❤ ${p.liked || 0} · 💬 ${p.comments || 0}</div>
              </div>
            </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('myPostList').innerHTML = `<div class="sub">${e}</div>`;
      }
    }
    let feedMinTime = Date.now() + 1;
    let feedOffset = 0;
    let feedLoading = false;
    let feedHasMore = true;

    async function loadFollowFeed(reset) {
      if (feedLoading) return;
      const box = document.getElementById('followFeed');
      if (reset) {
        feedMinTime = Date.now() + 1;
        feedOffset = 0;
        feedHasMore = true;
        box.innerHTML = '';
      }
      if (!feedHasMore) return;
      feedLoading = true;
      const moreBtn = document.getElementById('feedMore');
      moreBtn.disabled = true;
      moreBtn.textContent = '加载中…';
      try {
        const r = await axios.get('/post/of/follow', {
          params: { lastId: feedMinTime, offset: feedOffset }
        });
        const data = r.data;
        const list = data && data.list ? data.list : [];
        if (!list.length) {
          feedHasMore = false;
          if (reset) box.innerHTML = '<div class="sub">关注一些人后，这里会出现他们的晒单</div>';
        } else {
          if (reset) box.innerHTML = '';
          box.innerHTML += list.map(p => {
            const imgs = (p.images || '').split(',').filter(Boolean);
            return `
              <div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1eef9;cursor:pointer"
                   onclick="location.href='/post-detail.html?id=${p.id}'">
                ${imgs.length ? `<img src="${imgs[0]}" style="width:58px;height:58px;border-radius:9px;object-fit:cover;flex-shrink:0"
                      onerror="this.style.display='none'">` : ''}
                <div style="flex:1;min-width:0">
                  <div style="font-size:14px;font-weight:600">${escapeHtml(p.title || '')}</div>
                  <div class="sub">${escapeHtml(p.name || '闪友')} · ${escapeHtml(p.merchantName || '')} · ${(p.createTime || '').replace('T', ' ').slice(0, 16)}</div>
                  <div class="sub">❤ ${p.liked || 0} · 💬 ${p.comments || 0}</div>
                </div>
              </div>`;
          }).join('');
          feedMinTime = data.minTime;
          feedOffset = data.offset;
          feedHasMore = list.length === 2;
        }
      } catch (e) {
        if (reset) box.innerHTML = `<div class="sub">${e}</div>`;
      } finally {
        feedLoading = false;
        moreBtn.disabled = false;
        moreBtn.textContent = '加载更多';
        moreBtn.style.display = feedHasMore ? 'inline-flex' : 'none';
      }
    }

    function updateSignState(count) {
      document.getElementById('streakNum').textContent = count === null ? '-' : count;
      const signed = count !== null && count > 0;
      document.getElementById('todayState').textContent = count === null ? '-' : (signed ? '已签' : '未签');
      document.getElementById('signBtn').disabled = signed;
      document.getElementById('signBtn').textContent = signed ? '✓ 今日已签到' : '📅 签到打卡';
    }
    async function doSign() {
      const btn = document.getElementById('signBtn');
      try {
        await axios.post('/user/sign');
        toast('签到成功 🎉', 'success');
      } catch (e) {
        toast(typeof e === 'string' ? e : '签到失败', 'error');
      }
      // 无论成功与否都按后端真实状态刷新（连续/本月一起更新）
      try {
        const c = await axios.get('/user/sign/count');
        const m = await axios.get('/user/sign/month-count');
        updateSignState(c.data || 0);
        document.getElementById('monthNum').textContent = m.data || 0;
      } catch (e) { /* 下次刷新页面会再取 */ }
    }
    async function doLogout() {
      try {
        await axios.post('/user/logout', { refreshToken: sessionStorage.getItem('refreshToken') });
      } catch (e) { /* 忽略 */ }
      sessionStorage.clear();
      toast('已退出登录', 'success');
      setTimeout(() => location.href = '/index.html', 500);
    }
    loadProfile();
    loadOrders();
    loadMyPosts();
    loadFollowFeed(true);
  </script>
</body>
</html>
