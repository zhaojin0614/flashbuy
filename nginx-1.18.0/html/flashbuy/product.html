<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品详情 - 闪购 FlashBuy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav" class="nav"></div>
  <div class="container">
    <div id="pdWrap" class="pd-wrap"></div>
  </div>
  <script src="/js/axios.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    renderNav('index');
    loadMe();
    const qs = new URLSearchParams(location.search);
    const productId = qs.get('id'), merchantId = qs.get('merchantId');
    let product = null;
    async function loadProduct() {
      try {
        const r = await axios.get('/product/list/' + merchantId);
        product = r.data.find(p => String(p.id) === String(productId));
        if (!product) return document.getElementById('pdWrap').innerHTML = '<div class="empty">商品不存在</div>';
        document.title = product.title + ' - 闪购 FlashBuy';
        const limited = product.type === 1;
        document.getElementById('pdWrap').innerHTML = `
          <img class="pd-cover" src="/imgs/shops/${merchantId}.jpg" alt="" onerror="this.style.visibility='hidden'">
          <div class="card pd-panel">
            <span class="badge-limited">${limited ? '限量发售' : '常规商品'}</span>
            <h1 style="margin-top:10px">${product.title}</h1>
            <div class="sub">${product.subTitle || ''}</div>
            <div class="price">¥${(product.payValue / 100).toFixed(2)}
              <small>¥${(product.actualValue / 100).toFixed(2)}</small></div>
            <div class="rules">${product.rules || ''}</div>
            <button class="btn seckill-btn" id="buyBtn" onclick="buy()">${limited ? '⚡ 立即抢购' : '立即购买'}</button>
            <div class="countdown-tip">${limited ? 'Redis 原子预扣库存 · 异步下单 · 售完即止' : '提交订单后将在商户门店核销'}</div>
          </div>`;
      } catch (e) {
        document.getElementById('pdWrap').innerHTML = `<div class="empty">${e}</div>`;
      }
    }
    async function buy() {
      if (!isLoggedIn()) { toast('请先登录', 'error'); return goLogin(); }
      if (product.type !== 1) { toast('常规商品暂不支持线上下单（演示环境）', 'error'); return; }
      const btn = document.getElementById('buyBtn');
      btn.disabled = true; btn.textContent = '抢购中…';
      try {
        const r = await axios.post('/order/seckill/' + productId);
        btn.textContent = '⏳ 订单创建中…';
        toast('抢购成功！订单号 ' + r.data + '，订单正在异步创建', 'success');
        pollCount = 0;
        setTimeout(loadState, 2000);
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '⚡ 立即抢购';
        toast(typeof e === 'string' ? e : '抢购失败', 'error');
      }
    }
    // 抢购状态：ordered=已落库 / qualified=已占资格（异步落库中）/ 都没有=可抢
    let pollCount = 0;
    async function loadState() {
      if (!isLoggedIn()) return;
      try {
        const r = await axios.get('/order/state/' + productId);
        updateBuyBtn(r.data);
      } catch (e) { /* 静默，保持默认按钮 */ }
    }
    function updateBuyBtn(state) {
      const btn = document.getElementById('buyBtn');
      if (!btn || !product) return;
      if (state.ordered) {
        btn.disabled = true;
        btn.textContent = '✓ 已抢到 · 订单创建成功';
      } else if (state.qualified) {
        btn.disabled = true;
        btn.textContent = pollCount < 8 ? '⏳ 订单创建中…' : '⏳ 订单处理中，请稍后刷新';
        if (pollCount++ < 8) setTimeout(loadState, 2000);
      } else {
        btn.disabled = false;
        btn.textContent = product.type === 1 ? '⚡ 立即抢购' : '立即购买';
      }
    }
    loadProduct().then(loadState);
  </script>
</body>
</html>
