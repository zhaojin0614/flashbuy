<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品详情 - 闪购 FlashBuy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav" class="nav"></div>
  <div class="container">
    <div id="pdWrap" class="pd-wrap"></div>
  </div>
  <script src="/js/axios.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    renderNav('index');
    loadMe();
    const qs = new URLSearchParams(location.search);
    const productId = qs.get('id'), merchantId = qs.get('merchantId');
    let product = null;
    let pollCount = 0;
    let productRefreshed = false;

    function pad2(n) { return String(n).padStart(2, '0'); }
    function formatTime(value) {
      if (!value) return '-';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return '-';
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    function seckillPhase(p) {
      if (!p || p.type !== 1) return 'normal';
      const now = Date.now();
      const begin = new Date(p.beginTime).getTime();
      const end = new Date(p.endTime).getTime();
      if (!Number.isNaN(begin) && now < begin) return 'notStarted';
      if (!Number.isNaN(end) && now > end) return 'ended';
      if (Number(p.stock || 0) <= 0) return 'soldOut';
      return 'active';
    }
    const PHASE_TEXT = {
      active: '⚡ 立即抢购',
      notStarted: '⏳ 抢购未开始',
      ended: '已结束',
      soldOut: '已售罄',
      normal: '立即购买'
    };
    const PHASE_DESC = {
      active: '正在抢购中',
      notStarted: '抢购尚未开始',
      ended: '抢购已结束',
      soldOut: '库存已售罄',
      normal: ''
    };

    async function loadProduct() {
      try {
        const r = await axios.get('/product/list/' + merchantId);
        product = r.data.find(p => String(p.id) === String(productId));
        if (!product) return document.getElementById('pdWrap').innerHTML = '<div class="empty">商品不存在</div>';
        document.title = product.title + ' - 闪购 FlashBuy';
        const limited = product.type === 1;
        const phase = seckillPhase(product);
        const disabled = limited && phase !== 'active';
        const discount = product.actualValue > product.payValue && product.payValue > 0
          ? (product.payValue * 10 / product.actualValue).toFixed(1) : '';
        document.getElementById('pdWrap').innerHTML = `
          <img class="pd-cover" src="/imgs/shops/${merchantId}.svg" alt="" onerror="this.style.visibility='hidden'">
          <div class="card pd-panel">
            <span class="badge-limited">${limited ? '限量发售' : '常规商品'}</span>
            <h1 style="margin-top:10px">${product.title}</h1>
            <div class="sub">${product.subTitle || ''}</div>
            <div class="price">¥${(product.payValue / 100).toFixed(2)}
              <small>¥${(product.actualValue / 100).toFixed(2)}</small>
              ${discount ? `<span class="discount">${discount}折</span>` : ''}</div>
            <div class="rules">${product.rules || ''}</div>
            ${limited ? `
              <div class="seckill-info">
                <div class="seckill-row"><span>剩余库存</span><span><b>${Number(product.stock) || 0}</b> 件</span></div>
                <div class="seckill-row"><span>抢购时间</span><span>${formatTime(product.beginTime)} ~ ${formatTime(product.endTime)}</span></div>
                <div class="seckill-state ${phase}">${PHASE_DESC[phase]}</div>
              </div>` : ''}
            <button class="btn seckill-btn" id="buyBtn" onclick="buy()" ${disabled ? 'disabled' : ''}>${PHASE_TEXT[phase]}</button>
            <div class="countdown-tip">${limited ? 'Redis 原子预扣库存 · 异步下单 · 售完即止' : '提交订单后将在商户门店核销'}</div>
          </div>`;
      } catch (e) {
        document.getElementById('pdWrap').innerHTML = `<div class="empty">${e}</div>`;
      }
    }

    async function buy() {
      if (!isLoggedIn()) { toast('请先登录', 'error'); return goLogin(); }
      if (product.type !== 1) { toast('常规商品暂不支持线上下单（演示环境）', 'error'); return; }
      const phase = seckillPhase(product);
      if (phase !== 'active') { toast(PHASE_DESC[phase] || '当前不可抢购', 'error'); return; }
      const btn = document.getElementById('buyBtn');
      btn.disabled = true; btn.textContent = '抢购中…';
      try {
        const r = await axios.post('/order/seckill/' + productId);
        btn.textContent = '⏳ 订单创建中…';
        toast('抢购成功！订单号 ' + r.data + '，订单正在异步创建', 'success');
        pollCount = 0;
        setTimeout(() => loadProduct().then(loadState), 2000);
      } catch (e) {
        toast(typeof e === 'string' ? e : '抢购失败', 'error');
        loadProduct().then(loadState);
      }
    }

    // 抢购状态：ordered=已落库 / qualified=已占资格（异步落库中）/ 都没有=可抢
    async function loadState() {
      if (!isLoggedIn()) return;
      try {
        const r = await axios.get('/order/state/' + productId);
        updateBuyBtn(r.data);
      } catch (e) { /* 静默，保持默认按钮 */ }
    }

    function updateBuyBtn(state) {
      const btn = document.getElementById('buyBtn');
      if (!btn || !product) return;
      if (state.ordered) {
        btn.disabled = true;
        btn.textContent = '✓ 已抢到 · 订单创建成功';
        if (!productRefreshed) {
          productRefreshed = true;
          loadProduct().then(() => updateBuyBtn(state));
        }
      } else if (state.qualified) {
        btn.disabled = true;
        btn.textContent = pollCount < 8 ? '⏳ 订单创建中…' : '⏳ 订单处理中，请稍后刷新';
        if (pollCount++ < 8) setTimeout(loadState, 2000);
      } else {
        const phase = seckillPhase(product);
        btn.disabled = product.type === 1 && phase !== 'active';
        btn.textContent = PHASE_TEXT[phase] || '⚡ 立即抢购';
      }
    }

    loadProduct().then(loadState);
  </script>
</body>
</html>
