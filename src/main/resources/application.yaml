server:
  port: 8081
spring:
  config:
    # 本地密钥文件（可选）：项目根目录 application-local.yaml，已被 .gitignore 忽略
    # 加载优先级：环境变量 > 本地文件 > 本文件中的默认值
    import: optional:file:./application-local.yaml
  application:
    name: flashbuy
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/flashbuy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # 敏感配置：环境变量优先，缺省值仅供本地开发（公共仓库不含真实生产凭据）
    password: ${MYSQL_PASSWORD:1234}
  data:
    redis:
      host: localhost
      port: 6379
#      password: 123321
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.zhaojin.flashbuy.entity # 别名扫描包
logging:
  level:
    com.zhaojin.flashbuy: debug
jwt:
  # 签名密钥：同上，生产环境必须通过环境变量注入，且与默认值不同
  secret: ${JWT_SECRET:flashbuy-demo-hs256-secret-key-2026}
  access-ttl-hours: 2
cache:
  merchant:
    # 两级缓存开关：压测时可临时关闭，直接回源 DB
    enabled: true
    # 商户详情 L1 本地缓存：最多条数与写入过期时间
    local-max-size: 10000
    local-ttl-seconds: 120
rocketmq:
  # 本地环境由 docker/rocketmq/docker-compose.yml 拉起（NameServer 9876 + Broker 10911）
  name-server: 127.0.0.1:9876
  producer:
    # 生产者组：同组实例发送语义一致；事务消息回查也按组寻址
    group: flashbuy-order-producer
order:
  # 订单超时关单延迟级别（broker.conf 定制的 messageDelayLevel 第 14 档 = 15m）
  # 测试可用 --order.close-delay-level=1（1s）快速验证
  close-delay-level: 14
