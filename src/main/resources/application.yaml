server:
  port: 8081
spring:
  application:
    name: flashbuy
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/flashbuy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # 敏感配置：环境变量优先，缺省值仅供本地开发（公共仓库不含真实生产凭据）
    password: ${MYSQL_PASSWORD:1234}
  data:
    redis:
      host: localhost
      port: 6379
#      password: 123321
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.zhaojin.flashbuy.entity # 别名扫描包
logging:
  level:
    com.zhaojin.flashbuy: debug
jwt:
  # 签名密钥：同上，生产环境必须通过环境变量注入，且与默认值不同
  secret: ${JWT_SECRET:flashbuy-demo-hs256-secret-key-2026}
  access-ttl-hours: 2
